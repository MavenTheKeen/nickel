# README screenshots: load demo data, set a few budgets and capture the main screens.
# Not part of the test suite (config.yaml only picks up numbered flows in e2e/).
appId: dev.nickel.app
---
- launchApp:
    clearState: true
- runFlow: ../_skip-onboarding.yaml

# Demo data: a year of transactions plus three monthly subscriptions.
- tapOn: Settings
- scrollUntilVisible:
    element: '.*All data stays on this device.*'
    direction: DOWN
- longPressOn: '.*All data stays on this device.*'
- assertVisible:
    id: debug-screen
- scrollUntilVisible:
    element: Add 1,000 demo transactions
    direction: DOWN
- tapOn: Add 1,000 demo transactions
- extendedWaitUntil:
    visible: seed_import
    timeout: 60000
# Debug and Settings both sit on top of the tabs.
- back
- back
- assertVisible:
    id: home-screen

- tapOn: Budgets
- scrollUntilVisible:
    element: Groceries
    direction: DOWN
- tapOn: Groceries
- runFlow:
    file: ../_set-limit.yaml
    env:
      LIMIT: '700'
- runFlow: ../_allow-permission.yaml
- scrollUntilVisible:
    element: Eating out
    direction: DOWN
- tapOn: Eating out
- runFlow:
    file: ../_set-limit.yaml
    env:
      LIMIT: '250'
- scrollUntilVisible:
    element: Transport
    direction: DOWN
- tapOn: Transport
- runFlow:
    file: ../_set-limit.yaml
    env:
      LIMIT: '300'
- scrollUntilVisible:
    element: Fun
    direction: DOWN
- tapOn: Fun
- runFlow:
    file: ../_set-limit.yaml
    env:
      LIMIT: '200'
# Back to the top of the list.
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- takeScreenshot: screenshots/budgets

- tapOn: Home
- assertVisible:
    id: home-screen
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- takeScreenshot: screenshots/home

- tapOn: Transactions
- takeScreenshot: screenshots/transactions

- tapOn: Insights
- assertVisible:
    id: insights-screen
- takeScreenshot: screenshots/insights

- tapOn: Bills
- assertVisible:
    id: bills-screen
- takeScreenshot: screenshots/bills

- tapOn: Insights
- tapOn:
    id: open-review
- assertVisible:
    id: review-screen
- takeScreenshot: screenshots/review
