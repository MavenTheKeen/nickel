# Set a budget, spend against it, and check the warning state and safe-to-spend number.
appId: dev.nickel.app
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- tapOn: Budgets
- tapOn: Groceries
- runFlow:
    file: _set-limit.yaml
    env:
      LIMIT: '100'
- runFlow: _allow-permission.yaml
- assertVisible: '.*of \$100\.00.*'
- tapOn: Home
- assertVisible: Safe to spend today
- tapOn:
    id: add-transaction
- tapOn:
    id: amount-input
- inputText: '85'
- pressKey: Enter
- tapOn: Groceries
- scrollUntilVisible:
    element:
      id: save-transaction
- tapOn:
    id: save-transaction
- tapOn: Budgets
- assertVisible: '.*85% used, nearly at limit.*'
