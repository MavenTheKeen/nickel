# Record an expense from one line of text, then undo it.
appId: dev.nickel.app
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- tapOn:
    id: quick-add-input
- inputText: '8.25 eating out cafe'
- assertVisible:
    id: quick-add-preview
- assertVisible: '.*Eating out · cafe · today.*'
# Enter submits the line, the same as tapping Add, and closes the keyboard.
- pressKey: Enter
- assertVisible: 'Added to Eating out'
# The undo bar only stays for a few seconds, so undo first and check after.
- tapOn:
    id: undo-button
- assertNotVisible: 'Added to Eating out'
- scrollUntilVisible:
    element: Recent
- assertNotVisible: '-\$8\.25'
