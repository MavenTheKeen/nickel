# Delete a transaction by swiping and bring it back with undo.
appId: dev.nickel.app
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- tapOn: Add transaction
- tapOn:
    id: amount-input
- inputText: '4'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: merchant-input
- tapOn:
    id: merchant-input
- inputText: Coffee stand
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: save-transaction
- tapOn:
    id: save-transaction
- tapOn: Transactions
# Swipe from the amount on the right: the row moves at half the finger's speed,
# and a swipe starting at the merchant name near the left edge runs out of
# screen before the row passes the delete threshold.
# The undo bar stays for five seconds, so tap Undo as soon as it appears; its
# presence shows the swipe deleted the row.
- retry:
    maxRetries: 2
    commands:
      - swipe:
          from: '-\$4\.00'
          direction: LEFT
          duration: 600
      - tapOn:
          id: undo-button
- assertVisible: Coffee stand
- assertNotVisible:
    id: undo-button
