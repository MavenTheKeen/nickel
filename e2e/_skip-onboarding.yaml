# Shared step: a fresh install lands in either onboarding variant. Variant A
# shows the setup screens; skip them so every flow starts on Home.
appId: dev.nickel.app
---
- waitForAnimationToEnd
- runFlow: _dismiss-system-dialog.yaml
- runFlow:
    when:
      visible:
        id: onboarding-screen
    commands:
      - waitForAnimationToEnd
      - tapOn:
          text: Skip setup
          retryTapIfNoChange: true
- runFlow: _dismiss-system-dialog.yaml
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 15000
