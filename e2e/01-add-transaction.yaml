# Add an expense in three taps and see it on Home.
appId: dev.nickel.app
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- tapOn: Add transaction
- tapOn:
    id: amount-input
- inputText: '12.50'
# Enter closes the keyboard; Maestro's hideKeyboard presses Back when none is open.
- pressKey: Enter
- tapOn: Eating out
- scrollUntilVisible:
    element:
      id: save-transaction
- tapOn:
    id: save-transaction
- assertVisible:
    id: home-screen
- scrollUntilVisible:
    element: '-\$12\.50'
- assertVisible: 'Eating out'
