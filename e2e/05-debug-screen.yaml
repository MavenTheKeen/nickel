# Open the hidden debug screen and check that events, flags and timings are recorded.
appId: dev.nickel.app
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- tapOn: Settings
- scrollUntilVisible:
    element: '.*All data stays on this device.*'
    direction: DOWN
- longPressOn: '.*All data stays on this device.*'
- assertVisible:
    id: debug-screen
- assertVisible: '.*onboarding_v1.*'
- scrollUntilVisible:
    element: '.*cold_start.*'
    direction: DOWN
- scrollUntilVisible:
    element: '.*app_open.*'
    direction: DOWN
