# Open the hidden debug screen and check that events, flags and timings are recorded.
appId: dev.nickel.app
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- tapOn: Settings
- scrollUntilVisible:
    element: '.*All data stays on this device.*'
    direction: DOWN
- longPressOn: '.*All data stays on this device.*'
- assertVisible:
    id: debug-screen
- extendedWaitUntil:
    visible: onboarding_v1
    timeout: 15000
- scrollUntilVisible:
    element: app_open
    direction: DOWN
- scrollUntilVisible:
    element: cold_start
    direction: DOWN
