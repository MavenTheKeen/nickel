name: Release

# Pushing a tag such as v1.0.0 builds an Android APK for phones and attaches it
# to a GitHub release. The APK is signed with the debug key from the generated
# project, which is enough to install it directly; store builds go through EAS.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm run test:ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        # Release lint runs out of Metaspace on the runner; the same code is linted in CI.
        run: >
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "nickel-${TAG}.apk"
          gh release create "$TAG" "nickel-${TAG}.apk" --title "Nickel ${TAG#v}" --notes-file .github/release-notes.md
