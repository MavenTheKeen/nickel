name: E2E (Android)

# Builds a release APK and runs the Maestro flows on an Android emulator.
# Slower than the main CI (about 20 minutes), so it runs on main and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      screenshots:
        description: Capture README screenshots instead of running the tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}-${{ inputs.screenshots || false }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: 2.11.0
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          # No Sentry credentials in CI; skip the source map upload step.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        # Release lint runs out of Metaspace on the runner and checks nothing the flows need.
        run: >
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Install Maestro (pinned, checksum verified)
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum --check
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A phone-sized screen for README screenshots; the default for tests.
          profile: ${{ inputs.screenshots && 'pixel_6' || '' }}
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            if [ "${{ inputs.screenshots }}" = "true" ]; then maestro test e2e/screenshots/screenshots.yaml; else maestro test e2e/ --format junit --output e2e-report.xml; fi
            if [ "${{ inputs.screenshots }}" = "true" ]; then (adb shell screenrecord --bit-rate 6000000 /sdcard/demo.mp4 &); sleep 2; maestro test e2e/screenshots/demo.yaml; adb shell 'kill -INT $(pidof screenrecord)'; sleep 3; adb pull /sdcard/demo.mp4 demo.mp4; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-report
          path: |
            e2e-report.xml
            ~/.maestro/tests/
          if-no-files-found: ignore

      - name: Convert the demo recording to a GIF
        if: always() && inputs.screenshots && hashFiles('demo.mp4') != ''
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg > /dev/null
          ffmpeg -loglevel error -i demo.mp4 \
            -vf "fps=12,scale=360:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" \
            demo.gif

      - name: Upload screenshots
        if: always() && inputs.screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            screenshots/*.png
            e2e/screenshots/screenshots/*.png
            demo.mp4
            demo.gif
          if-no-files-found: warn
