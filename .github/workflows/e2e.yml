name: E2E (Android)

# Builds a release APK and runs the Maestro flows on an Android emulator.
# Slower than the main CI (about 20 minutes), so it runs on main and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: 2.11.0
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          # No Sentry credentials in CI; skip the source map upload step.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Install Maestro (pinned, checksum verified)
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum --check
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test e2e/ --format junit --output e2e-report.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-report
          path: |
            e2e-report.xml
            ~/.maestro/tests/
          if-no-files-found: ignore
